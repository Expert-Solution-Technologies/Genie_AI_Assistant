<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genie AI Assistant – Demo</title>
<style>
  :root{
    --blue:#1f7ad1; --btn:#2b86e0; --genie:#035a99; --orange:#f37a21;
    --text:#2b2f33; --muted:#6b7480; --border:#e3e6ea; --api:#1f7ad1; --db:#7b4fd6;
    --green:#1e9e5a; --red:#d64545;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);font-size:14px}
  .hidden{display:none!important}

  /* ================= LOGIN / OTP ================= */
  .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    background:linear-gradient(118deg,#061a3c 0%,#0a3e6e 30%,#06679a 55%,#0297c2 72%,#00bcd6 86%,#5ff6ee 100%)}
  .auth-card{width:480px;max-width:100%;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .auth-logo{background:#f4f4f4;height:210px;display:flex;align-items:center;justify-content:center}
  .auth-logo img{width:330px;max-width:78%}
  .auth-body{padding:26px 30px 22px}
  .auth-body label{display:block;font-weight:600;color:#333;font-size:16px;margin:0 0 10px}
  .auth-body input{width:100%;height:43px;border:1px solid #c9d1da;border-radius:3px;background:#e8f0fe;padding:0 12px;font-size:16px;font-family:inherit;color:#222}
  .auth-body input:focus{outline:none;border-color:#222;box-shadow:0 0 0 3px #cfe5fb;background:#fff}
  .field{margin-bottom:22px}
  .link{color:#1a73e8;text-decoration:none;font-size:16px}
  .btn-primary{background:var(--btn);color:#fff;border:0;border-radius:2px;height:43px;padding:0 16px;font-size:16px;cursor:pointer;font-family:inherit}
  .btn-primary:hover{background:#1f76cc}
  .or{display:flex;align-items:center;gap:12px;color:#999;margin:26px 0 12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:#ddd}
  .gbtn{display:flex;align-items:center;gap:8px;margin:0 auto;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.18);border-radius:3px;padding:9px 14px;font-size:16px;cursor:pointer;font-family:inherit;color:#333}
  .terms{text-align:center;margin-top:26px;font-size:16px;color:#333}
  .btn-outline{display:block;margin:30px auto 0;background:#fff;border:1px solid var(--btn);color:var(--btn);height:43px;padding:0 15px;font-size:16px;cursor:pointer;font-family:inherit}

  /* ================= APP ================= */
  .app{height:100vh;overflow:hidden;background:linear-gradient(118deg,#061a3c 0%,#0a3e6e 30%,#06679a 55%,#0297c2 72%,#00bcd6 86%,#5ff6ee 100%);display:flex;flex-direction:column}
  .app-head{height:72px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
  .app-head img{height:42px}
  .who{display:flex;align-items:center;gap:12px;font-size:15px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--genie);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .who a{color:var(--muted);font-size:13px;text-decoration:none;border-left:1px solid var(--border);padding-left:12px;cursor:pointer}
  .app-main{flex:1;display:flex;justify-content:center;padding:22px 24px 14px;min-height:0}
  .chat-wrap{width:100%;max-width:1100px;display:flex;flex-direction:column;min-height:0}
  .chat-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .chat-title h1{margin:0;font-size:24px;color:#fff;font-weight:600}
  .chat-title span{color:#d8eefc;font-size:13.5px}
  .chat-box{flex:1;background:#fff;border:0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:0}
  .msg{line-height:1.55}
  .msg.user{align-self:flex-end;max-width:75%;background:var(--blue);color:#fff;padding:9px 15px;border-radius:16px 16px 3px 16px}
  .msg.bot{align-self:flex-start;width:92%;background:#f6f8fb;border:1px solid var(--border);padding:13px 15px;border-radius:16px 16px 16px 3px}
  .bot-head{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--genie);margin-bottom:5px}
  .group-label{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#fff;border:1px solid #c6dcf2;color:#14456f;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;text-align:left}
  
  .chip:hover{filter:brightness(.97);background:#f3f8fd}
  .status{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .status div::before{content:"✓ ";color:var(--green);font-weight:700}
  .status div.now::before{content:"";display:inline-block;width:10px;height:10px;border:2px solid #9ab;border-top-color:var(--blue);border-radius:50%;margin-right:7px;animation:spin .7s linear infinite;vertical-align:-1px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .src{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;margin:8px 0 6px}
  .src.api{background:#e3f0fc;color:var(--api)} .src.db{background:#efe8fc;color:var(--db)}
  table.res{border-collapse:collapse;width:100%;background:#fff;font-size:13px;margin-top:6px;border:1px solid var(--border)}
  table.res th{background:#eef2f6;text-align:left;padding:7px 9px;font-weight:600;border-bottom:1px solid var(--border)}
  table.res td{padding:6px 9px;border-bottom:1px solid #f0f2f4}
  table.res .num{text-align:right;font-variant-numeric:tabular-nums}
  table.res tr.total td{font-weight:700;background:#fafbfc}
  .neg{color:var(--red)} .warn{color:#b26a00;font-weight:600}
  .tbl-scroll{overflow-x:auto}
  .chart{margin-top:10px;background:#fff;border:1px solid var(--border);border-radius:4px;padding:8px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 4px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
  details.how{margin-top:10px;background:#fff;border:1px solid var(--border);border-radius:6px}
  details.how summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;color:#445}
  .how-body{padding:4px 12px 10px}
  .step{display:flex;gap:10px;margin:8px 0}
  .dot{width:24px;height:24px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
  .dot.gemini{background:linear-gradient(135deg,#4285f4,#9b72cb)} .dot.api{background:var(--api)} .dot.db{background:var(--db)} .dot.guard{background:#c47f00}
  .step-t{font-weight:600;font-size:13px}
  .step-t small{font-weight:400;color:#8a94a0}
  .step-d{font-size:12px;color:var(--muted);margin-top:2px}
  .step-b{min-width:0;flex:1}
  pre.code{background:#1e2530;color:#d7e1ec;font-size:11.5px;line-height:1.5;padding:8px 10px;border-radius:4px;overflow-x:auto;margin:5px 0 0}
  pre.code .k{color:#7fc1ff} pre.code .c{color:#8fa1b3;font-style:italic} pre.code .s{color:#b5e48c}
  .checks{list-style:none;padding:0;margin:5px 0 0;font-size:12px}
  .checks li::before{content:"✓ ";color:var(--green);font-weight:700}
  .composer{border-top:1px solid var(--border);padding:12px;display:flex;gap:8px}
  .composer input{flex:1;border:1px solid #cfd6dd;border-radius:6px;padding:11px 13px;font-size:14px;font-family:inherit}
  .composer input:focus{outline:2px solid #a9d0f5;border-color:var(--blue)}
  .composer button{background:var(--btn);color:#fff;border:0;border-radius:6px;padding:0 20px;font-size:14px;cursor:pointer;font-family:inherit}
  .composer button:disabled{opacity:.6;cursor:wait}
  .foot{text-align:center;color:#d8eefc;font-size:12px;margin-top:10px}
  @media (max-width:640px){
    .app-head{padding:0 14px} .app-head img{height:32px}
    .msg.bot,.msg.user{width:100%;max-width:100%}
    .chat{padding:12px}
  }
</style>
</head>

/* ---------------- screens ---------------- */
const $ = s => document.querySelector(s);
function show(id){ ["login","otp","app"].forEach(x => $("#"+x).classList.toggle("hidden", x !== id)); }
$("#loginForm").addEventListener("submit", e => { e.preventDefault(); show("otp"); $("#code").focus(); });
$("#otpForm").addEventListener("submit", e => { e.preventDefault(); show("app"); window.scrollTo(0,0); if (!chat.children.length) welcome(); chat.scrollTop = 0; $("#q").focus({preventScroll:true}); });
$("#otpLogout").addEventListener("click", () => show("login"));
$("#logout").addEventListener("click", () => { chat.innerHTML = ""; show("login"); });

/* ---------------- chat helpers ---------------- */
const chat = $("#chat"), input = $("#q"), sendBtn = $("#send");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const money = n => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const scroll = () => chat.scrollTop = chat.scrollHeight;

function addMsg(cls, html){
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html; chat.appendChild(el); scroll(); return el;
}
const BOT = `<div class="bot-head">✨ Genie AI</div>`;

function chips(){
  const btn = s => `<button class="chip" data-q="${esc(s.label)}">${esc(s.label)}</button>`;
  return `<div class="chips" style="margin-top:10px">${SCENARIOS.map(btn).join("")}</div>`;
}
function welcome(){
  addMsg("bot", `${BOT}Try these:${chips()}`);
}

function table(t){
  const fmtCol = i => t.money === true || (Array.isArray(t.money) && t.money.includes(i));
  const head = t.cols.map((c,i) => `<th class="${i?"num":""}">${c}</th>`).join("");
  const body = t.rows.map(r => {
    const tot = r[r.length-1] === "t"; const cells = tot ? r.slice(0,-1) : r;
    return `<tr class="${tot?"total":""}">` + cells.map((v,i) => {
      if (!i) return `<td>${v}</td>`;
      let o = v;
      if (typeof v === "number") o = fmtCol(i) ? `<span class="${v<0?"neg":""}">${money(v)}</span>` : v.toLocaleString("en-US",{minimumFractionDigits: Number.isInteger(v)?0:2});
      else if (/^-\d/.test(v)) o = `<span class="neg">${v}</span>`;
      return `<td class="num">${o}</td>`;
    }).join("") + `</tr>`;
  }).join("");
  return `<div class="tbl-scroll"><table class="res"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function chart(c){
  const W=600,H=200,pl=58,pb=26,pt=10;
  const max = Math.max(...c.series.flatMap(s=>s.data))*1.12;
  const gw=(W-pl-10)/c.labels.length, bw=Math.min(34,(gw-18)/c.series.length);
  const lab = v => c.plain==="hrs" ? Math.round(v)+"" : c.plain==="$" ? "$"+Math.round(v) : "$"+Math.round(v/1000)+"k";
  let g="",b="";
  for(let i=0;i<=4;i++){const v=max*i/4,y=H-pb-(H-pb-pt)*i/4;
    g+=`<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#eef1f4"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#8a94a0">${lab(v)}</text>`;}
  c.labels.forEach((l,gi)=>{const gx=pl+gi*gw+(gw-bw*c.series.length)/2;
    c.series.forEach((s,si)=>{const h=(H-pb-pt)*s.data[gi]/max;
      b+=`<rect x="${gx+si*bw+1}" y="${H-pb-h}" width="${bw-3}" height="${h}" rx="2" fill="${s.color}"><title>${s.name} · ${l}: ${s.data[gi]}</title></rect>`;});
    b+=`<text x="${pl+gi*gw+gw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#555">${l}</text>`;});
  return `<div class="chart"><div class="legend">${c.series.map(s=>`<span style="--c:${s.color}">${s.name}</span>`).join("")}</div><svg viewBox="0 0 ${W} ${H}" width="100%">${g}${b}</svg></div>`;
}

function how(sc){
  const lbl={gemini:"Gemini",api:"Genie API",db:"Genie database",guard:"BI server"}, ic={gemini:"G",api:"API",db:"DB",guard:"✓"};
  return `<details class="how"><summary>How this was answered · ${sc.route==="api"?"Genie API":"Database"} (${sc.steps.length} steps)</summary><div class="how-body">` +
    sc.steps.map((s,i)=>`<div class="step"><div class="dot ${s.k}">${ic[s.k]}</div><div class="step-b">
      <div class="step-t">${i+1}. ${s.t} <small>· ${lbl[s.k]}</small></div>
      ${s.d?`<div class="step-d">${s.d}</div>`:""}${s.code?`<pre class="code">${s.code}</pre>`:""}
      ${s.checks?`<ul class="checks">${s.checks.map(c=>`<li>${c}</li>`).join("")}</ul>`:""}</div></div>`).join("") + `</div></details>`;
}


/* Close status answer adapts to the month in the question (default September) */
const MONTHS=["january","february","march","april","may","june","july","august","september","october","november","december"];
function closeAnswer(q){
  const s=q.toLowerCase(); let m=8;
  MONTHS.forEach((name,i)=>{ if(new RegExp("\\b("+name+"|"+name.slice(0,3)+")\\b").test(s)) m=i; });
  const today=new Date(2026,9,22), year = m>=today.getMonth() ? 2025 : 2026;
  const label=MONTHS[m][0].toUpperCase()+MONTHS[m].slice(1)+" "+year;
  const rows=[["Barclays plc","AIEST","Murali, Siva",15,"Bank & Card, AR"],["Bunge Ltd.","Kumar, Giri","AIEST",17,"Payroll"],
              ["Galaxy Corp","Rao, Anita","Murali, Siva",20,"Balance Sheet"],["Forum, Inc.","Kumar, Giri","Rao, Anita",25,"Income Statement, Other"]];
  const pad=n=>String(n).padStart(2,"0");
  const out=rows.map(r=>{ const d=new Date(year,m+1,r[3]); const late=Math.round((today-d)/864e5);
    return [r[0],r[1],r[2],`${pad(d.getMonth()+1)}-${pad(d.getDate())}-${d.getFullYear()}`, late>0?`<span class='neg'>${late}</span>`:"—", r[4]]; });
  const top=out[0];
  return { text:`<b>4 companies</b> haven't closed <b>${label}</b>. <b>Barclays plc</b> is the furthest behind${top[4]!=="—"?`, ${top[4].replace(/<[^>]+>/g,"")} days past its close deadline,`:","} with Bank &amp; Card and Accounts Receivable still open.`,
    table:{cols:["Company","Primary Accountant","Reviewer","Close Deadline","Days Overdue","Open Sections"],rows:out} };
}

/* ---------------- ask flow ---------------- */
async function ask(q){
  q = q.trim(); if (!q) return;
  addMsg("user", esc(q));
  input.value=""; input.disabled = sendBtn.disabled = true;
  const sc = SCENARIOS.find(s => s.match.test(q));
  const bot = addMsg("bot", `${BOT}<div class="status"></div>`);
  const st = bot.querySelector(".status");

  if (!sc){
    st.innerHTML = `<div class="now">Understanding your question</div>`; await sleep(1100);
    bot.innerHTML = `${BOT}This demo only answers the sample questions. Try one of these:${chips()}`;
    return finish();
  }
  for (const line of sc.live){
    st.querySelectorAll(".now").forEach(n => n.classList.remove("now"));
    st.insertAdjacentHTML("beforeend", `<div class="now">${line}</div>`); scroll();
    await sleep(800);
  }
  const a = sc.id === "close" ? closeAnswer(q) : sc.answer;
  const src = sc.route==="api"
    ? `<span class="src api">● Source: Genie API · your Genie access</span>`
    : `<span class="src db">● Source: Genie database (read-only) · limited to your ${N} companies</span>`;
  bot.innerHTML = `${BOT}<div>${a.text}</div>${src}${a.table?table(a.table):""}${a.chart?chart(a.chart):""}`;
  finish();
}
function finish(){ input.disabled = sendBtn.disabled = false; input.focus({preventScroll:true}); scroll(); }

$("#composer").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
chat.addEventListener("click", e => { const c = e.target.closest(".chip"); if (c && !sendBtn.disabled) ask(c.dataset.q); });
</script>
